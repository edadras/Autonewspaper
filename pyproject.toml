[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-newspaper-studio"
version = "1.0.0"
description = "Autonomous AI-powered newspaper & magazine desktop publishing system driving Adobe InDesign and Photoshop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Newspaper Studio" }]
keywords = ["indesign", "photoshop", "dtp", "newspaper", "ai", "layout"]

dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "Pillow>=10.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "keyring>=25.0; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pyinstaller>=6.5"]

[project.scripts]
ai-newspaper-studio = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["adobe/scripts/*.jsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "adobe: requires a real Adobe installation (skipped elsewhere)",
    "gui: requires a Qt display",
    "network: requires outbound network access",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
